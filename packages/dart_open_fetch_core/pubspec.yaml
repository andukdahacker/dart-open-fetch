name: dart_open_fetch_core
description: Schema parser and code generator for dart_open_fetch. Converts OpenAPI 3.0/3.1 specs into typed Dart clients and models.
version: 0.3.0
repository: https://github.com/andukdahacker/dart-open-fetch
issue_tracker: https://github.com/andukdahacker/dart-open-fetch/issues
topics:
  - openapi
  - codegen
  - code-generation

environment:
  sdk: '>=3.5.0 <4.0.0'

resolution: workspace

dependencies:
  yaml: ^3.1.0
  code_builder: ^4.7.0
  dart_style: ^3.0.0
  collection: ^1.17.0
  pub_semver: ^2.1.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0

false_secrets:
  - /test/fixtures/github.yaml
