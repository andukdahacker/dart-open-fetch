name: dart_open_fetch_workspace
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'

workspace:
  - packages/dart_open_fetch
  - packages/dart_open_fetch_core
  - packages/dart_open_fetch_runtime

dev_dependencies:
  melos: ^7.4.0

melos:
  name: dart_open_fetch_workspace

  scripts:
    analyze:
      description: Run dart analyze on all packages
      run: dart analyze --fatal-infos
      exec:
        concurrency: 1

    test:
      description: Run tests in all packages
      run: dart test
      exec:
        concurrency: 1
      packageFilters:
        dirExists: test

    format-check:
      description: Check formatting of all packages
      run: dart format --set-exit-if-changed .
      exec:
        concurrency: 1
